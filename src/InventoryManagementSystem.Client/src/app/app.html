<div class="min-h-screen bg-slate-900 text-slate-100 font-sans">
  <!-- Top Navigation Header -->
  <p-toolbar class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-3">
    <ng-template #start>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="pi pi-box text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wide text-white leading-tight">Inventory Management System</h1>
          <p class="text-xs text-slate-400">Powered by PrimeNG 20 & Tailwind CSS</p>
        </div>
      </div>
    </ng-template>

    <ng-template #end>
      <div class="flex items-center gap-3">
        <p-tag value="PrimeNG 20" severity="info" class="font-mono text-xs"></p-tag>
        <p-tag value="Tailwind v4" severity="success" class="font-mono text-xs"></p-tag>
        <p-button icon="pi pi-cog" [text]="true" [rounded]="true" severity="secondary"></p-button>
      </div>
    </ng-template>
  </p-toolbar>

  <!-- Main Content Body -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-100">Dashboard Overview</h2>
        <p class="text-sm text-slate-400">Welcome to your inventory control center</p>
      </div>
      <div class="flex items-center gap-3">
        <p-button label="Add Item" icon="pi pi-plus" severity="primary"></p-button>
      </div>
    </div>

    <!-- Quick Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p-card class="shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Products</span>
            <div class="text-3xl font-extrabold text-white mt-1">1,248</div>
          </div>
          <div class="w-12 h-12 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
            <i class="pi pi-list text-2xl"></i>
          </div>
        </div>
      </p-card>

      <p-card class="shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Low Stock Alert</span>
            <div class="text-3xl font-extrabold text-amber-400 mt-1">14</div>
          </div>
          <div class="w-12 h-12 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center">
            <i class="pi pi-exclamation-triangle text-2xl"></i>
          </div>
        </div>
      </p-card>

      <p-card class="shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Value</span>
            <div class="text-3xl font-extrabold text-emerald-400 mt-1">$84,520</div>
          </div>
          <div class="w-12 h-12 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
            <i class="pi pi-dollar text-2xl"></i>
          </div>
        </div>
      </p-card>
    </div>

    <!-- Router Outlet for Child Views -->
    <div class="mt-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
