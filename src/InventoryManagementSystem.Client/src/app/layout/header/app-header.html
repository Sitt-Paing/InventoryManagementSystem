<header class="app-header h-14 sticky top-0 z-40 px-4 flex items-center justify-between shadow-xs transition-colors duration-200">
  <!-- Left Section: Sidebar Toggle & Brand Logo -->
  <div class="flex items-center gap-3">
    <button 
      pButton 
      type="button" 
      icon="pi pi-bars" 
      [text]="true" 
      [rounded]="true" 
      severity="secondary"
      (click)="sharedService.toggleSidebar()" 
      title="Toggle Sidebar">
    </button>

    <!-- Brand Logo -->
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md flex items-center justify-center text-white font-bold shadow-xs"
           style="background: var(--accent-gradient);">
        <i class="pi pi-box text-xs"></i>
      </div>
      <div class="leading-tight">
        <h1 class="text-sm font-bold tracking-tight">{{ 'APP.NAME' | translate }}</h1>
      </div>
    </div>

    <!-- Breadcrumb (Center-Left) -->
    <div class="hidden md:flex items-center gap-1.5 text-xs font-medium opacity-70 ml-3">
      <i class="pi pi-home text-xs"></i>
      <span>/</span>
      <span>{{ breadcrumb.parentTransKey ? (breadcrumb.parentTransKey | translate) : breadcrumb.parent }}</span>
      <span>/</span>
      <span class="font-semibold text-emerald-600 dark:text-emerald-400">
        {{ breadcrumb.childTransKey ? (breadcrumb.childTransKey | translate) : breadcrumb.child }}
      </span>
    </div>
  </div>

  <!-- Right Section: Global Search, Language, Theme Toggle & User -->
  <div class="flex items-center gap-2 sm:gap-3 ml-auto">
    <!-- Language Selector Pill & Dropdown (Transparent Background) -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleLangDropdown($event)"
        class="h-8 px-2.5 flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-semibold text-slate-700 dark:text-slate-200 hover:border-emerald-500 dark:hover:border-emerald-400 transition-colors cursor-pointer"
        [title]="'HEADER.SELECT_LANGUAGE' | translate">
        <i class="pi pi-globe text-emerald-600 dark:text-emerald-400 text-xs"></i>
        <span class="font-bold tracking-wide text-slate-600 text-xs">{{ translationService.currentLanguage() === 'en' ? 'EN' : 'MM' }}</span>
        <i class="pi pi-chevron-down text-[9px]  transition-transform duration-200" [class.rotate-180]="isLangDropdownOpen"></i>
      </button>

      <!-- Language Dropdown Popup Menu -->
      @if (isLangDropdownOpen) {
        <div
          class="absolute right-0 mt-1.5 w-44 rounded-xl bg-white dark:bg-[#12201a] border border-slate-200 dark:border-slate-700 shadow-xl py-1 z-50 animate-in fade-in duration-100"
          (click)="$event.stopPropagation()">
          
          <!-- English Option -->
          <button
            type="button"
            (click)="selectLanguage('en')"
            class="w-full px-3 py-2 text-left flex items-center justify-between text-xs transition-colors cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60"
            [ngClass]="translationService.currentLanguage() === 'en' ? 'font-bold text-emerald-600 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300'">
            <div class="flex items-center gap-2">
              <span class="font-bold text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">EN</span>
              <span>English</span>
            </div>
            @if (translationService.currentLanguage() === 'en') {
              <i class="pi pi-check text-xs text-emerald-600 dark:text-emerald-400 font-bold"></i>
            }
          </button>

          <!-- Myanmar Option -->
          <button
            type="button"
            (click)="selectLanguage('mm')"
            class="w-full px-3 py-2 text-left flex items-center justify-between text-xs transition-colors cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60"
            [ngClass]="translationService.currentLanguage() === 'mm' ? 'font-bold text-emerald-600 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300'">
            <div class="flex items-center gap-2">
              <span class="font-bold text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300">MM</span>
              <span class="font-sans">မြန်မာ (Myanmar)</span>
            </div>
            @if (translationService.currentLanguage() === 'mm') {
              <i class="pi pi-check text-xs text-emerald-600 dark:text-emerald-400 font-bold"></i>
            }
          </button>
        </div>
      }
    </div>

    <!-- Theme Toggle Icon Button (Transparent Background) -->
    <button 
      type="button" 
      (click)="sharedService.toggleDarkMode()"
      class="h-8 w-8 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-slate-700 dark:text-slate-200 hover:border-emerald-500 dark:hover:border-emerald-400 transition-colors cursor-pointer"
      [title]="sharedService.isDarkMode() ? ('HEADER.SWITCH_TO_LIGHT' | translate) : ('HEADER.SWITCH_TO_DARK' | translate)">
      <i [class]="sharedService.isDarkMode() ? 'pi pi-sun text-sm text-amber-400' : 'pi pi-moon text-sm text-slate-700 dark:text-slate-500'"></i>
    </button>

    <div class="h-5 w-px opacity-30 bg-current"></div>

    <!-- User Dropdown (Transparent Background) -->
    <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
    <button
      type="button"
      (click)="userMenu.toggle($event)"
      class="h-8 px-2 flex items-center gap-2 rounded-lg bg-transparent hover:opacity-80 transition-opacity cursor-pointer">
      <div class="w-6 h-6 rounded-full text-white font-bold flex items-center justify-center text-[10px]"
           style="background: var(--accent-gradient);">
        {{ userInitial }}
      </div>
      <div class="hidden sm:block text-left leading-tight">
        <p class="text-xs font-bold leading-none">{{ displayName }}</p>
        <p class="text-[9px] opacity-60 uppercase font-mono leading-none mt-0.5">{{ userRole }}</p>
      </div>
      <i class="pi pi-chevron-down text-[9px] opacity-50"></i>
    </button>
  </div>
</header>
