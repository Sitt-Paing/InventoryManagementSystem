<header class="app-header h-14 sticky top-0 z-40 px-4 flex items-center justify-between shadow-xs transition-colors duration-200">
  <!-- Left Section: Sidebar Toggle & Brand Logo -->
  <div class="flex items-center gap-3">
    <button 
      pButton 
      type="button" 
      icon="pi pi-bars" 
      [text]="true" 
      [rounded]="true" 
      severity="secondary"
      (click)="sharedService.toggleSidebar()" 
      title="Toggle Sidebar">
    </button>

    <!-- Brand Logo -->
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md flex items-center justify-center text-white font-bold shadow-xs"
           style="background: var(--accent-gradient);">
        <i class="pi pi-box text-xs"></i>
      </div>
      <div class="leading-tight">
        <h1 class="text-sm font-bold tracking-tight">INVENTORY</h1>
      </div>
    </div>

    <!-- Breadcrumb (Center-Left) -->
    <div class="hidden md:flex items-center gap-1.5 text-xs font-medium opacity-70 ml-3">
      <i class="pi pi-home text-xs"></i>
      <span>/</span>
      <span>{{ breadcrumb.parent }}</span>
      <span>/</span>
      <span class="font-semibold text-emerald-600 dark:text-emerald-400">{{ breadcrumb.child }}</span>
    </div>
  </div>

  <!-- Right Section: Global Search, Language, Theme Toggle & User -->
  <div class="flex items-center gap-3 ml-auto">
    <!-- Search Input Box -->
    <!-- <div class="relative hidden sm:block w-48 lg:w-60">
      <input 
        type="text" 
        placeholder="Search..." 
        class="w-full text-xs py-1.5 pl-3 pr-8 rounded-lg outline-none p-inputtext" />
      <i class="pi pi-search absolute right-2.5 top-1/2 -translate-y-1/2 text-xs opacity-50 pointer-events-none"></i>
    </div> -->

    <!-- Language Selector Pill -->
    <div class="hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold cursor-pointer">
      <i class="pi pi-globe text-xs text-emerald-600"></i>
      <span>EN</span>
      <i class="pi pi-chevron-down text-[10px] opacity-60"></i>
    </div>

    <!-- Theme Toggle Icon Button -->
    <button 
      type="button" 
      (click)="sharedService.toggleDarkMode()"
      class="p-2 rounded-lg transition-colors opacity-80 hover:opacity-100 cursor-pointer"
      [title]="sharedService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <i [class]="sharedService.isDarkMode() ? 'pi pi-sun text-sm text-amber-400' : 'pi pi-moon text-sm text-slate-700'"></i>
    </button>

    <div class="h-5 w-px opacity-30 bg-current"></div>

    <!-- User Dropdown -->
    <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
    <button
      type="button"
      (click)="userMenu.toggle($event)"
      class="flex items-center gap-2 px-2 py-1 rounded-lg transition-colors cursor-pointer hover:opacity-80">
      <div class="w-7 h-7 rounded-full text-white font-bold flex items-center justify-center text-xs"
           style="background: var(--accent-gradient);">
        {{ displayName.charAt(0).toUpperCase() }}
      </div>
      <div class="hidden sm:block text-left leading-tight">
        <p class="text-xs font-bold">{{ displayName }}</p>
        <p class="text-[9px] opacity-60 uppercase font-mono">ADMIN</p>
      </div>
      <i class="pi pi-chevron-down text-[10px] opacity-50"></i>
    </button>
  </div>
</header>
