<aside
  class="app-sidebar h-[calc(100vh-3.5rem)] transition-all duration-300 ease-in-out flex flex-col justify-between overflow-y-auto select-none"
  [ngClass]="sharedService.sidebarCollapsed() ? 'w-16' : 'w-60'">

  <div class="py-4 px-3 space-y-5">
    <div *ngFor="let group of navGroups" class="space-y-1">
      <button *ngIf="!sharedService.sidebarCollapsed()" type="button" (click)="toggleGroup(group.groupName)"
        class="w-full flex items-center justify-between px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100 transition-colors cursor-pointer select-none group/hdr rounded-md hover:bg-slate-100 dark:hover:bg-slate-800/50">
        <span>{{ group.transKey ? (group.transKey | translate) : group.groupName }}</span>
        <i class="pi pi-chevron-down text-[9px] text-slate-500 dark:text-slate-400 group-hover/hdr:text-slate-700 dark:group-hover/hdr:text-slate-200 transition-transform duration-200"
          [class.-rotate-90]="!isGroupExpanded(group.groupName)">
        </i>
      </button>

      <div *ngIf="isGroupExpanded(group.groupName) || sharedService.sidebarCollapsed()" class="space-y-1">
        <a *ngFor="let item of group.items" [routerLink]="item.routerLink" routerLinkActive="active-nav-item"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/40">

          <i [class]="item.icon + ' text-sm group-hover:scale-105 transition-transform text-slate-500 dark:text-slate-400'"></i>

          <span *ngIf="!sharedService.sidebarCollapsed()" class="truncate flex-1">
            {{ item.transKey ? (item.transKey | translate) : item.label }}
          </span>

          <span *ngIf="!sharedService.sidebarCollapsed() && item.data?.badge"
            [class]="'text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ' + item.data?.badgeSeverity">
            {{ item.data?.badge }}
          </span>
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom User Status Pill -->
  <div *ngIf="!sharedService.sidebarCollapsed()"
    class="p-2.5 m-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-300/20">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-full text-white font-bold flex items-center justify-center text-[10px] shadow-xs"
        style="background: var(--accent-gradient);">
        {{ userInitial }}
      </div>
      <div class="overflow-hidden flex-1 leading-tight">
        <p class="text-xs font-bold truncate">{{ userName }}</p>
        <p class="text-[10px] font-semibold flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online
        </p>
      </div>
      <button type="button" (click)="logout()"
        class="opacity-60 hover:opacity-100 hover:text-rose-500 transition-colors p-1 cursor-pointer"
        [title]="'HEADER.LOGOUT' | translate">
        <i class="pi pi-power-off text-xs"></i>
      </button>
    </div>
  </div>
</aside>
